<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>BASTION CYCLES KOREA</title>
<meta name="robots" content="noindex">
<script>
  // 기존 아임웹 하위 페이지 주소(/archetype, /showroom ...)를 원페이지 섹션으로 연결
  // /en/..., /ja/... 로 들어온 주소는 같은 언어 페이지의 섹션으로 연결
  // 저널, 뉴스, 영상 등 없어진 페이지는 홈으로 이동
  // github.io 미리보기(/bastion/)와 자체 도메인(/) 모두 동작
  var base = location.hostname.slice(-10) === 'github.io' ? '/bastion/' : '/';
  var parts = location.pathname.slice(base.length).toLowerCase().split('/').filter(Boolean);
  var lang = (parts[0] === 'en' || parts[0] === 'ja') ? parts.shift() + '/' : '';
  var key = parts[0] || '';
  var map = {
    brand:'brand', mission:'brand', purpose:'brand', founders:'brand',
    archetype:'archetype',
    models:'models', superleggera:'models', crossroad:'models', 'arch-angel':'models', archangel:'models', panterra:'models', 'bc-01':'models',
    universe:'process', process:'process',
    gallery:'gallery',
    showroom:'showroom'
  };
  location.replace(base + lang + (map[key] ? '#' + map[key] : ''));
</script>
<style>body{background:#000}</style>
</head>
<body></body>
</html>
